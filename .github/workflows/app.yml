name: Python CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    
    - name: Install ruff
      run: pip install ruff
    
    - name: Run ruff linter
      run: ruff check . --output-format=github
    
    - name: Run ruff formatter check
      run: ruff format . --check
