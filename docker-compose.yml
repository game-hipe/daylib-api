services:
  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  database:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: video-server
    ports:
      - "8080:80"

    volumes:
      - ${VIDEO_PATH}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # добавляем эту строку
    environment:
      - VIDEO_PATH=${VIDEO_PATH} # просто для информации (не используется Nginx напрямую)

    restart: unless-stopped

  app:
    build: .
    container_name: "app-api"

    ports:
      - 8000:8000

    volumes:
      - ${VIDEO_PATH}:${VIDEO_PATH}

    depends_on:
      database:
        condition: service_healthy
      
      redis:
        condition: service_healthy

    env_file:
      - ".env"


  spider_celery:
    build: .
    container_name: "app-celery-spider"
    entrypoint: ""
    command: celery -A core.manager.spider._worker worker

    volumes:
      - ${VIDEO_PATH}:${VIDEO_PATH}

    env_file:
      - ".env"
    depends_on:
      redis:
        condition: service_healthy


  ffmpeg_celery:
    build: .
    container_name: "app-celery-ffmpeg"
    entrypoint: ""
    command: celery -A core.spider.hentai._task worker

    volumes:
      - ${VIDEO_PATH}:${VIDEO_PATH}

    env_file:
      - ".env"

    depends_on:
      redis:
        condition: service_healthy


volumes:
  postgres_data: